services:
  backend:
    build: ./backend
    ports:
      - "8888:8888"
    environment:
      - CORS_ORIGINS=http://localhost:5173
      - MAX_IMG_SIZE=50
      - MAX_VIDEO_SIZE=100
      - MODEL_NAME=yolo26n.pt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/health')"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8888
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped